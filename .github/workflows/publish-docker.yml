name: Build and Publish DonSeTch GHCR Images

# Packaging-only pipeline: downloads donsetch release binaries from the
# upstream repo (dondai44423/donsetch), verifies the .sha256 sidecars,
# and pushes thin GHCR images. No Rust toolchain involved.
#
# Triggers:
#   - workflow_dispatch with an optional version (e.g. 5.5.9; blank = latest)
#   - cron poll of the upstream latest release; a build is skipped when the
#     version tag already exists on GHCR (the upstream repo is someone
#     else's, so we poll instead of listening for release events)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream donsetch version (blank = latest)"
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UPSTREAM_REPO: dondai44423/donsetch

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pick.outputs.version }}
      build: ${{ steps.pick.outputs.build }}
      is_latest: ${{ steps.pick.outputs.is_latest }}
    steps:
      - name: Resolve latest upstream release
        id: latest
        run: |
          LATEST=$(curl -fsSL "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" \
            | jq -r .tag_name | sed 's/^v//')
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST"

      - name: Pick version and check GHCR
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          IS_LATEST=true
          if [ -z "$VERSION" ]; then
            VERSION="${{ steps.latest.outputs.version }}"
          else
            IS_LATEST=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_latest=$IS_LATEST" >> "$GITHUB_OUTPUT"
          # Anonymous pull token against GHCR; HEAD the manifest for this
          # version tag. 200 = already published, skip the whole build.
          OWNER=$(echo "$IMAGE_NAME" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:${IMAGE_NAME}:pull" | jq -r .token)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${OWNER}/$(echo "$IMAGE_NAME" | cut -d/ -f2)/manifests/${VERSION}")
          if [ "$CODE" = "200" ] && [ "$IS_LATEST" = "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Image ${IMAGE_NAME}:${VERSION} already exists; skipping."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            asset: donsetch-linux-x64
          - arch: arm64
            platform: linux/arm64
            asset: donsetch-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download upstream release artifact and verify sha256
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          BASE="https://github.com/${UPSTREAM_REPO}/releases/download/v${VERSION}/${{ matrix.asset }}"
          mkdir -p build-context
          curl -fsSL -o "build-context/${{ matrix.asset }}.tar.gz" "${BASE}.tar.gz"
          curl -fsSL -o "${{ matrix.asset }}.tar.gz.sha256" "${BASE}.tar.gz.sha256"
          ( cd build-context && sha256sum -c "../${{ matrix.asset }}.tar.gz.sha256" )
          tar -xzf "build-context/${{ matrix.asset }}.tar.gz" -C build-context
          rm -f "build-context/${{ matrix.asset }}.tar.gz"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push single-arch image
        uses: docker/build-push-action@v6
        with:
          context: build-context
          file: ${{ matrix.arch == 'amd64' && './Dockerfile' || './Dockerfile.arm64' }}
          platforms: ${{ matrix.platform }}
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/dondai44423/donsetch
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: >-
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.version }}-${{ matrix.arch }}

  manifest:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          BASE="${REGISTRY}/${IMAGE_NAME}"
          docker buildx imagetools create \
            -t "${BASE}:${VERSION}" \
            "${BASE}:${VERSION}-amd64" "${BASE}:${VERSION}-arm64"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          docker buildx imagetools create \
            -t "${BASE}:${MAJOR}" -t "${BASE}:${MINOR}" \
            "${BASE}:${VERSION}-amd64" "${BASE}:${VERSION}-arm64"
          if [ "${{ needs.resolve.outputs.is_latest }}" = "true" ]; then
            docker buildx imagetools create \
              -t "${BASE}:latest" \
              "${BASE}:${VERSION}-amd64" "${BASE}:${VERSION}-arm64"
          fi
